<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Login &amp; Registration | Vow &amp; Co.</title>
  <meta name="description" content="Sign in to access your wedding shortlist, budget manager, and guest list synchronization.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .auth-card {
      max-width: 460px;
      margin: 40px auto;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-medium);
      padding: 36px;
      box-shadow: var(--shadow-soft);
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--color-text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .auth-tab.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
    }
  </style>
</head>
<body>

  <!-- Sticky Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="brand-logo">
        <span class="brand-name">Vow &amp; Co.</span>
        <span class="brand-tagline">Curated Indian Weddings</span>
      </a>

      <nav class="main-nav">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="vendors.html" class="nav-link">Find Vendors</a>
        <a href="planner.html" class="nav-link">Wedding Planner</a>
        <a href="inspiration.html" class="nav-link">Inspiration &amp; Muhurat</a>
        <a href="shortlist.html" class="nav-link">
          Shortlist <span class="nav-badge shortlist-badge-count">0</span>
        </a>
      </nav>

      <div class="header-actions">
        <a href="onboarding.html" class="btn btn-outline btn-sm">Are you a Vendor?</a>
        <button class="menu-toggle" aria-label="Toggle navigation drawer">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="section-sm">
    <div class="container">
      <div class="auth-card">
        
        <div class="auth-tabs">
          <div class="auth-tab active" id="tab-login" onclick="switchAuth('login')">Sign In</div>
          <div class="auth-tab" id="tab-register" onclick="switchAuth('register')">Create Account</div>
        </div>

        <!-- Login Form -->
        <form id="form-login" onsubmit="handleAuthSubmit(event, 'login')">
          <div class="form-group">
            <label class="form-label">Email or Mobile Number</label>
            <input type="text" class="form-control" placeholder="priyal@example.com" value="priyal.sharma@example.com" required>
          </div>
          <div class="form-group">
            <div style="display: flex; justify-content: space-between;">
              <label class="form-label">Password</label>
              <a href="#" style="font-size: 0.8rem; color: var(--color-primary);" onclick="showToast('Password reset link sent to registered email', '✉'); return false;">Forgot?</a>
            </div>
            <input type="password" class="form-control" value="••••••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 12px;">Sign In to Planning Suite</button>
        </form>

        <!-- Register Form -->
        <form id="form-register" style="display: none;" onsubmit="handleAuthSubmit(event, 'register')">
          <div class="form-group">
            <label class="form-label">Bride or Groom Name</label>
            <input type="text" class="form-control" placeholder="e.g. Priyal Sharma &amp; Siddharth" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" placeholder="name@domain.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Target Wedding Date</label>
            <input type="date" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Create Password</label>
            <input type="password" class="form-control" placeholder="Minimum 8 characters" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 12px;">Create Couple Account</button>
        </form>

        <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--color-border-light); text-align: center; font-size: 0.85rem; color: var(--color-text-muted);">
          Looking for vendor partnership login? <a href="onboarding.html" style="color: var(--color-primary); font-weight: 600;">Go to Partner Alliance &rarr;</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="padding-top: 0; border: none;">
        <span>&copy; 2026 Vow &amp; Co. Curated Indian Weddings.</span>
        <div style="display: flex; gap: 20px;">
          <a href="../index.html">Home</a>
          <a href="vendors.html">Vendors</a>
          <a href="planner.html">Planning Suite</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script>
    function switchAuth(type) {
      document.getElementById('tab-login').classList.toggle('active', type === 'login');
      document.getElementById('tab-register').classList.toggle('active', type === 'register');
      document.getElementById('form-login').style.display = type === 'login' ? 'block' : 'none';
      document.getElementById('form-register').style.display = type === 'register' ? 'block' : 'none';
    }

    function handleAuthSubmit(e, type) {
      e.preventDefault();
      showToast(type === 'login' ? 'Welcome back! Synced with your wedding plan.' : 'Account created! Redirecting to planning suite...', '★');
      setTimeout(() => {
        window.location.href = 'planner.html';
      }, 1000);
    }
  </script>
</body>
</html>
